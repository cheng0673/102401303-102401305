<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>福大失物招领 - 信息详情</title>
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body data-page="detail">
  <div class="app">
    <header class="page-header">
      <a class="back-btn" href="index.html" aria-label="返回首页">‹</a>
      <h2>信息详情</h2>
      <span class="header-placeholder"></span>
    </header>

    <main>
      <!-- 正常内容容器 -->
      <div id="detailWrap" class="detail" hidden>
        <!-- 标题区 -->
        <section class="detail-hero">
          <div class="hero-top">
            <span id="dTypeBadge" class="badge"></span>
            <span id="dStatus" class="status"></span>
          </div>
          <h2 id="dTitle"></h2>
          <p class="publish-time">发布时间：<span id="dCreatedAt"></span></p>
        </section>

        <!-- 基础信息 -->
        <section class="info-panel">
          <div class="info-row">
            <span class="info-label">物品类别</span>
            <span class="info-value" id="dCategory"></span>
          </div>
          <div class="info-row">
            <span class="info-label">所属校区</span>
            <span class="info-value" id="dCampus"></span>
          </div>
          <div class="info-row">
            <span class="info-label" id="dPlaceLabel">丢失地点</span>
            <span class="info-value" id="dLocation"></span>
          </div>
          <div class="info-row">
            <span class="info-label" id="dTimeLabel">丢失时间</span>
            <span class="info-value" id="dTime"></span>
          </div>
          <a class="info-row publisher-row" id="publisherRow" href="#" aria-label="查看发布者主页">
            <span class="info-label">发布者</span>
            <span class="info-value publisher-value">
              <span class="publisher-avatar" id="dPublisherAvatar"></span>
              <span id="dPublisher"></span>
              <span class="row-arrow">›</span>
            </span>
          </a>
        </section>

        <!-- 描述 -->
        <section class="info-panel">
          <p class="panel-title">📝 物品描述</p>
          <p class="panel-content" id="dDescription"></p>
        </section>

        <!-- 物品图片 -->
        <section class="info-panel" id="dGalleryPanel" hidden>
          <p class="panel-title">🖼 物品图片</p>
          <div class="detail-gallery" id="dGallery"></div>
        </section>

        <!-- 联系方式 -->
        <section class="info-panel">
          <p class="panel-title">📞 联系方式</p>
          <div class="info-row">
            <div class="contact-value">
              <span class="contact-text" id="dContact"></span>
              <button type="button" class="btn btn-primary btn-copy" id="copyBtn">复制</button>
            </div>
          </div>
        </section>

        <!-- 收藏（始终显示） -->
        <div class="detail-actions">
          <button type="button" class="btn btn-outline btn-block" id="favBtn"></button>
        </div>

        <!-- 状态操作（仅进行中显示） -->
        <div class="detail-actions" id="doneActionWrap">
          <button type="button" class="btn btn-primary btn-block" id="markDoneBtn"></button>
        </div>

        <!-- 举报入口（新功能一） -->
        <div class="report-entry" id="reportEntry">
          <a id="reportLink" href="#">⚠️ 举报此信息</a>
        </div>
      </div>

      <!-- 信息不存在 / 链接异常 -->
      <div id="notFound" class="not-found" hidden>
        <span class="empty-icon" style="font-size:52px;">😵</span>
        <p style="margin:12px 0 18px;color:var(--text-sub);">这条信息不存在或已被删除</p>
        <a class="btn btn-primary" href="index.html" style="display:inline-flex;">返回首页</a>
      </div>
    </main>

    <!-- 全屏看图层 -->
    <div class="img-viewer" id="imgViewer" hidden>
      <img id="imgViewerImg" src="" alt="物品图片大图">
    </div>

    <!-- 底部导航 -->
        <nav class="bottom-nav">
      <a class="nav-item" data-nav="index" href="index.html">首页</a>
      <a class="nav-item nav-publish" data-nav="publish" href="publish.html" aria-label="发布"></a>
      <a class="nav-item" data-nav="profile" href="profile.html">我的</a>
    </nav>
  </div>

  <script src="js/storage.js?v=5"></script>
  <script src="js/common.js?v=5"></script>
  <script src="js/detail.js?v=5"></script>
</body>
</html>
