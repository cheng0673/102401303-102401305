<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>福大失物招领 - 首页</title>
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body data-page="index">
  <!-- ============ 启动页（水彩校园背景，2.4s 后进入登录页） ============ -->
  <div id="splashView" class="gate-view splash-view" hidden>
    <img class="splash-bg" src="img/campus-watercolor.jpg" alt="福大校园水彩全景">
    <div class="splash-content">
      <div class="splash-logo">
        <img src="img/logo.png" alt="福州大学校徽">
      </div>
      <div class="splash-title">福大失物招领</div>
      <div class="splash-subtitle" id="splashSubtitle">旗山校区 · 让每一件失物找到回家的路</div>
    </div>
    <div class="splash-footer">
      <div class="splash-motto">明德至诚 · 博学远志</div>
      <div class="splash-skip" id="splashSkip">点击任意位置进入</div>
    </div>
  </div>

  <!-- ============ 登录页 ============ -->
  <div id="loginView" class="gate-view login-view" hidden>
    <img class="login-bg" src="img/campus-watercolor.jpg" alt="">
    <div class="login-scroll">
      <div class="login-head">
        <div class="login-logo">福</div>
        <div class="login-app-name">福大失物招领</div>
        <div class="login-slogan">福州大学校园互助失物招领平台</div>
        <div class="login-motto">明德至诚 · 博学远志</div>
      </div>

      <form class="login-form" id="loginForm" novalidate>
        <div class="form-group" id="accountGroup">
          <label for="accountInput">学号 / 手机号</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input id="accountInput" class="form-control" type="text" inputmode="numeric"
                   placeholder="请输入学号或手机号" autocomplete="username" maxlength="12">
          </div>
          <p class="error-text">请输入 8-12 位学号或 11 位手机号</p>
        </div>

        <div class="form-group" id="passwordGroup">
          <label for="passwordInput">密码</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input id="passwordInput" class="form-control" type="password"
                   placeholder="请输入密码（至少 6 位）" autocomplete="current-password">
            <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="显示或隐藏密码">👁</button>
          </div>
          <p class="error-text">密码至少 6 位</p>
        </div>

        <div class="login-row">
          <span></span>
          <button type="button" class="link-btn" id="forgotBtn">忘记密码？</button>
        </div>

        <button type="submit" class="btn btn-primary btn-block login-btn">账号登录</button>
      </form>

      <div class="login-links">
        <button type="button" class="link-btn guest-btn" id="guestBtn">先逛逛 › 游客浏览</button>
      </div>

      <p class="login-agreement">登录即代表同意《用户协议》与《隐私政策》 · 课程演示无真实后端，任意符合格式的账号均可登录</p>
    </div>
  </div>

  <!-- ============ 主应用 ============ -->
  <div class="app">
    <!-- 顶部：校徽 + 标题 + 校区切换 + 搜索栏 -->
    <header class="app-header">
      <div class="header-top">
        <img class="header-logo" src="img/logo.png" alt="福州大学校徽">
        <h1>福大失物招领</h1>
        <select class="campus-select" id="campusSelect" aria-label="切换校区">
          <option value="旗山校区">旗山校区</option>
          <option value="铜盘校区">铜盘校区</option>
          <option value="晋江校区">晋江校区</option>
          <option value="怡山校区">怡山校区</option>
          <option value="厦门校区">厦门校区</option>
          <option value="泉港校区">泉港校区</option>
        </select>
      </div>
      <div class="search-bar">
        <input id="searchInput" type="search" placeholder="搜索物品名称，如：校园卡"
               aria-label="搜索失物招领信息">
      </div>
    </header>

    <!-- 类型 Tab + 类别胶囊筛选 -->
    <div class="toolbar">
      <div class="toolbar-row">
        <div class="type-tabs" role="tablist">
          <button class="type-tab active" data-type="all" type="button">全部</button>
          <button class="type-tab" data-type="lost" type="button">寻物</button>
          <button class="type-tab" data-type="found" type="button">招领</button>
        </div>
        <label class="sort-wrap" aria-label="按时间排序">
          <span class="sort-icon">🕒</span>
          <select class="sort-select" id="sortSelect" aria-label="排序方式">
            <option value="desc">最新发布</option>
            <option value="asc">最早发布</option>
          </select>
        </label>
      </div>
      <div class="category-pills" id="categoryPills" role="tablist" aria-label="按类别筛选">
        <!-- 类别胶囊由 index.js 动态生成 -->
      </div>
    </div>

    <!-- 信息列表 -->
    <main>
      <section id="itemList" class="list" aria-live="polite"></section>

      <!-- 空状态 -->
      <section id="emptyState" class="empty" hidden>
        <span class="empty-icon">🔎</span>
        <span class="empty-text">没有找到相关信息</span>
        <a class="btn btn-primary" href="publish.html" style="display:inline-flex;">📢 我要发布一条</a>
      </section>
    </main>

    <!-- 底部导航 -->
        <nav class="bottom-nav">
      <a class="nav-item" data-nav="index" href="index.html">首页</a>
      <a class="nav-item nav-publish" data-nav="publish" href="publish.html" aria-label="发布"></a>
      <a class="nav-item" data-nav="profile" href="profile.html">我的</a>
    </nav>

  </div>

  <script src="js/storage.js?v=8"></script>
  <script src="js/common.js?v=8"></script>
  <script src="js/auth.js?v=8"></script>
  <script src="js/index.js?v=8"></script>
</body>
</html>
